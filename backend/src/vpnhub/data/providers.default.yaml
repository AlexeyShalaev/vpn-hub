# Каталог VPS-провайдеров (дефолт). При первом старте копируется в VPNHUB_PROVIDERS_FILE,
# дальше редактируется руками или из админки в запущенном инстансе.
# Цены намеренно не храним — они слишком часто меняются (живые тарифы — в provider_plans).
#
# Поля: id, name, url (страница заказа), blurb (RU) / blurbEn (EN) — текст карточки, tags — бейджи,
# hq — страна компании (ISO-код, может быть пустой), countries — где можно арендовать VPS (ISO-коды),
# payments — способы оплаты: ru_card (карты РФ/МИР), sbp, ru_wallet (ЮMoney/WebMoney), crypto,
# card (зарубежные Visa/Mastercard), paypal, bank (счёт/перевод), local (местные: Alipay, PIX, UPI…).
